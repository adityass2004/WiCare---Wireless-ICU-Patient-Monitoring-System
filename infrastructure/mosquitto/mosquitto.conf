# WiCare Mosquitto broker configuration
# Listener for MQTT over TCP (local Wi-Fi + loopback)
listener 1883 0.0.0.0

# Allow anonymous connections (local-only dev; no auth)
allow_anonymous true

# Persistence for retained LWT status messages
persistence true
persistence_location /mosquitto/data/

# Logging
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true

# Disable websocket for this phase (devices use raw MQTT only)
# listener 9001
# protocol websockets
